<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — НГТУ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 15px; padding: 20px 30px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0, 64, 133, 0.08); border-top: 4px solid #007bff; }
        .header h1 { color: #004085; font-size: 24px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .logout-btn:hover { background: #c82333; }
        .section-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .section-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); transition: transform 0.3s; border: 1px solid #e9ecef; }
        .section-card:hover { transform: translateY(-3px); border-color: #007bff; }
        .section-card.full { background: #fff8f0; border: 2px solid #ff8c00; }
        .section-name { font-weight: bold; margin-bottom: 5px; color: #004085; }
        .section-schedule { font-size: 12px; color: #007bff; margin-bottom: 8px; font-weight: 500; }
        .section-count { font-size: 24px; font-weight: bold; color: #007bff; }
        .section-limit { font-size: 12px; color: #6c757d; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 150px; padding: 15px; background: white; border: 2px solid #e9ecef; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; color: #495057; }
        .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .tab-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .tab-content { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 20px rgba(0, 64, 133, 0.08); display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #004085; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 16px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #007bff; }
        .form-group input:disabled { background: #f8f9fa; color: #6c757d; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .application-card { border: 1px solid #e9ecef; border-radius: 10px; padding: 20px; margin-bottom: 15px; background: #fafbfc; border-left: 4px solid #007bff; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; text-transform: uppercase; }
        .status-new { background: #fff3cd; color: #856404; }
        .status-pending { background: #cce5ff; color: #004085; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-review { background: #ff8c00; color: white; }
        .file-upload { border: 2px dashed #ced4da; padding: 25px; text-align: center; border-radius: 10px; margin: 15px 0; background: #f8f9fa; }
        .file-upload input[type="file"] { margin-bottom: 10px; }
        .error { color: #dc3545; margin: 10px 0; font-weight: 500; }
        .success { color: #28a745; margin: 10px 0; font-weight: 500; }
        .empty-state { text-align: center; padding: 40px; color: #6c757d; }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .waitlist-position-card { background: linear-gradient(135deg, #ff8c00, #e07b00); color: white; border-radius: 12px; padding: 15px 20px; margin-top: 12px; display: flex; align-items: center; gap: 12px; }
        .waitlist-position-card .pos-num { font-size: 36px; font-weight: bold; background: rgba(255,255,255,0.2); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .waitlist-position-card .pos-text { font-size: 14px; line-height: 1.4; }
        .waitlist-position-card .pos-text strong { font-size: 16px; }
        .payment-instruction { background: #fff3cd; border: 2px solid #ff8c00; border-radius: 12px; padding: 20px; margin-top: 12px; }
        .payment-instruction h4 { color: #856404; margin-bottom: 12px; font-size: 16px; }
        .payment-amount { font-size: 28px; font-weight: bold; color: #dc3545; margin: 10px 0; }
        .payment-steps { background: white; border-radius: 8px; padding: 15px; margin-top: 12px; }
        .payment-steps p { font-weight: bold; margin-bottom: 8px; color: #004085; }
        .payment-step { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e9ecef; font-size: 14px; }
        .payment-step:last-child { border-bottom: none; }
        .payment-step .step-arrow { color: #007bff; font-weight: bold; }
        .payment-note { background: #ffeeba; border-radius: 6px; padding: 8px 12px; margin-top: 10px; font-size: 13px; color: #856404; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👨‍🎓 Личный кабинет</h1>
        <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>

    <div class="section-stats" id="section-stats">
        <div class="section-card"><div class="section-name">Загрузка...</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('my-apps')">📋 Мои заявки</button>
        <button class="tab-btn" onclick="switchTab('new-app')">➕ Новая заявка</button>
        <button class="tab-btn" id="receipt-tab" onclick="switchTab('receipt')" disabled>💰 Загрузить чек</button>
    </div>

    <div id="my-apps" class="tab-content active">
        <div id="apps-loading" class="empty-state"><div class="icon">⏳</div><p>Загрузка заявок...</p></div>
        <div id="apps-list"></div>
    </div>

    <div id="new-app" class="tab-content">
        <div class="form-group"><label>ФИО</label><input type="text" id="app-name" readonly></div>
        <div class="form-group">
            <label>Секция</label>
            <select id="app-section"><option value="">Загрузка секций...</option></select>
            <small id="section-availability" style="color: #6c757d; display: block; margin-top: 5px;"></small>
        </div>
        <div class="form-group">
            <label>Курс обучения</label>
            <select id="app-course">
                <option value="1">1 курс</option>
                <option value="2">2 курс</option>
                <option value="3">3 курс (сокращённое расписание)</option>
            </select>
            <small style="color: #6c757d; display: block; margin-top: 5px;">Влияет на сумму оплаты и количество занятий</small>
        </div>
        <button class="btn btn-primary" onclick="submitApplication()">📤 Подать заявку</button>
        <div id="app-result"></div>
    </div>

    <div id="receipt" class="tab-content">
        <div id="receipt-info"><p style="color: #6c757d;">Выберите заявку со статусом «Ожидает оплаты», чтобы загрузить чек.</p></div>
        <div id="receipt-form" style="display: none;">
            <div class="form-group"><label>Заявка</label><select id="receipt-app-select"></select></div>
            <div class="file-upload">
                <input type="file" id="receipt-file" accept=".jpg,.jpeg,.png,.pdf">
                <p style="margin-top: 10px; color: #6c757d; font-size: 13px;">Допустимые форматы: JPG, PNG, PDF (макс. 10 МБ)</p>
            </div>
            <button class="btn btn-success" onclick="uploadReceipt()">📤 Загрузить чек</button>
            <div id="receipt-result"></div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('ngtu_user') || 'null');
    if (!user || user.role?.toLowerCase() !== 'student') { window.location.href = '/'; }
    document.getElementById('app-name').value = user.full_name || user.username;

    const SECTION_ICONS = { 'баскетбол': '🏀', 'волейбол': '🏐', 'футбол': '⚽', 'плавание': '🏊', 'теннис': '🎾', 'бокс': '🥊', 'борьба': '🤼', 'легкая атлетика': '🏃', 'гимнастика': '🤸', 'шахматы': '♟️', 'бадминтон': '🏸', 'настольный теннис': '🏓' };
    function getSectionIcon(name) { return SECTION_ICONS[name.toLowerCase()] || '🏆'; }

    function logout() { localStorage.removeItem('ngtu_user'); window.location.href = '/'; }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        if (tabId === 'my-apps') loadApplications();
        if (tabId === 'new-app') loadSectionStats();
        if (tabId === 'receipt') prepareReceiptTab();
    }

    async function loadSectionStats() {
        const container = document.getElementById('section-stats');
        const select = document.getElementById('app-section');
        container.innerHTML = '<div class="section-card"><div class="section-name">Загрузка...</div></div>';
        select.innerHTML = '<option value="">Загрузка секций...</option>';

        try {
            const res = await fetch('/api/sections/stats');
            const data = await res.json();
            if (!data.success || !data.sections || data.sections.length === 0) {
                container.innerHTML = '<p style="color: #6c757d; text-align:center; padding:20px; grid-column: 1/-1;">Нет доступных секций</p>';
                select.innerHTML = '<option value="">Нет доступных секций</option>';
                return;
            }
            container.innerHTML = '';
            select.innerHTML = '<option value="">Выберите секцию</option>';

            data.sections.forEach(sec => {
                const card = document.createElement('div');
                card.className = `section-card ${sec.isFull ? 'full' : ''}`;
                const icon = getSectionIcon(sec.name);
                const scheduleText = sec.schedule_info ? `🕒 ${sec.schedule_info}` : '🕒 Расписание уточняется';

                card.innerHTML = `
                    <div class="section-name">${icon} ${sec.name}</div>
                    <div class="section-schedule">${scheduleText}</div>
                    <div class="section-count">${sec.enrolled}/${sec.capacity}</div>
                    <div class="section-limit" style="color: ${sec.isFull ? '#ff8c00' : '#28a745'}">
                        ${sec.isFull ? '⚠️ Мест нет (заявка на рассмотрение)' : sec.available + ' мест'}
                    </div>
                `;
                container.appendChild(card);

                const option = document.createElement('option');
                option.value = sec.name;
                option.textContent = `${icon} ${sec.name} (${sec.schedule_info || 'Без расписания'}) — ${sec.enrolled}/${sec.capacity}`;
                if (sec.isFull) option.textContent += ' [Мест нет, заявка на рассмотрение]';
                select.appendChild(option);
            });
        } catch (e) {
            container.innerHTML = '<p style="color: #dc3545; grid-column: 1/-1;">Ошибка загрузки</p>';
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
        }
    }

    async function loadApplications() {
        const container = document.getElementById('apps-list');
        const loading = document.getElementById('apps-loading');
        if (!user.phone) {
            loading.style.display = 'none';
            container.innerHTML = '<p class="error">⚠️ В вашем профиле не указан телефон.</p>';
            return;
        }
        loading.style.display = 'block';
        container.innerHTML = '';

        try {
            const res = await fetch('/api/applications/find', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: user.phone }) });
            const data = await res.json();

            loading.style.display = 'none';
            if (!data.success || !data.applications.length) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>У вас пока нет заявок</p><button class="btn btn-primary" onclick="switchTab('new-app')" style="margin-top: 15px;">➕ Подать заявку</button></div>`;
                return;
            }

            container.innerHTML = '';
            let hasPending = false;

            for (const app of data.applications) {
                if (app.status === 'Ожидает оплаты') hasPending = true;
                const dbId = app.db_id || app.id.replace('#', '');

                let statusClass = 'status-new';
                const st = app.status || '';
                if (st.includes('рассмотрении')) statusClass = 'status-review';
                else if (st.includes('Ожидает')) statusClass = 'status-pending';
                else if (st.includes('Подтверждено') || st.includes('Завершено')) statusClass = 'status-confirmed';
                else if (st.includes('Отклонено')) statusClass = 'status-rejected';
                else if (st.includes('ожидания')) statusClass = 'status-review';

                let waitlistBlock = '';
                if (app.status === 'На рассмотрении') {
                    waitlistBlock = `<p style="color:#ff8c00; margin-top:8px; font-weight:500; background:#fff3cd; padding:10px; border-radius:8px;">⏳ Секция заполнена. Ваша заявка находится в листе ожидания на рассмотрении у администратора.</p>`;
                } else if (app.status === 'В списке ожидания') {
                    waitlistBlock = `<p style="color:#ff8c00; margin-top:8px; font-weight:500;">⏳ Вы в списке ожидания</p>`;
                }

                let paymentBlock = '';
                if (app.status === 'Ожидает оплаты') {
                    paymentBlock = `<div class="payment-instruction"><h4>💳 Инструкция по оплате</h4><div class="payment-amount">Сумма уточняется</div><div class="payment-note">📝 Обратитесь к администратору для получения точной суммы и реквизитов.</div></div>`;
                }

                const card = document.createElement('div');
                card.className = 'application-card';
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <strong style="font-size: 18px; color:#004085;">${app.id}</strong>
                        <span class="status-badge ${statusClass}">${app.status}</span>
                    </div>
                    <p><strong>Секция:</strong> ${app.section}</p>
                    <p><strong>Дата:</strong> ${app.date || '—'}</p>
                    ${app.receipt_url ? `<p style="color: #28a745; font-weight: 500;">✅ Чек загружен</p>` : ''}
                    ${waitlistBlock}${paymentBlock}
                `;
                container.appendChild(card);
            }
            document.getElementById('receipt-tab').disabled = !hasPending;
        } catch (e) {
            loading.style.display = 'none';
            container.innerHTML = '<p class="error">❌ Ошибка загрузки заявок</p>';
        }
    }

    async function submitApplication() {
        const section = document.getElementById('app-section').value;
        const name = document.getElementById('app-name').value;
        const phone = user.phone || '';
        const courseYear = document.getElementById('app-course').value;
        const result = document.getElementById('app-result');
        if (!section) { result.innerHTML = '<span class="error">Выберите секцию</span>'; return; }
        if (!name || !phone) { result.innerHTML = '<span class="error">Ошибка: проверьте данные профиля</span>'; return; }
        result.innerHTML = '';
        try {
            const res = await fetch('/api/applications/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ student_name: name, phone, section, course_year: courseYear }) });
            const data = await res.json();
            if (data.success) {
                result.innerHTML = `<span class="success">✅ ${data.message}</span>`;
                setTimeout(() => { switchTab('my-apps'); loadApplications(); }, 2000);
            } else {
                result.innerHTML = `<span class="error">❌ ${data.error}</span>`;
            }
        } catch (e) { result.innerHTML = '<span class="error">❌ Ошибка сети</span>'; }
    }

    async function prepareReceiptTab() {
        const info = document.getElementById('receipt-info');
        const form = document.getElementById('receipt-form');
        if (!user.phone) { info.innerHTML = '<p class="error">⚠️ Телефон не указан</p>'; info.style.display = 'block'; form.style.display = 'none'; return; }
        try {
            const res = await fetch('/api/applications/find', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: user.phone }) });
            const data = await res.json();
            const pending = data.applications?.filter(a => a.status === 'Ожидает оплаты' && !a.has_receipt) || [];
            if (pending.length === 0) {
                info.style.display = 'block'; form.style.display = 'none';
                info.innerHTML = pending.length === 0 && data.applications?.length > 0 ? '<p>✅ У вас нет заявок, ожидающих чек</p>' : '<p>📭 Подайте заявку, чтобы загрузить чек</p>';
                return;
            }
            info.style.display = 'none'; form.style.display = 'block';
            const select = document.getElementById('receipt-app-select');
            select.innerHTML = '';
            pending.forEach(app => {
                const opt = document.createElement('option');
                opt.value = app.db_id || app.id.replace('#', '');
                opt.textContent = `${app.id} — ${app.section}`;
                select.appendChild(opt);
            });
        } catch (e) {
            info.innerHTML = '<p class="error">Ошибка загрузки</p>'; info.style.display = 'block'; form.style.display = 'none';
        }
    }

    async function uploadReceipt() {
        const appId = document.getElementById('receipt-app-select').value;
        const fileInput = document.getElementById('receipt-file');
        const file = fileInput.files[0];
        const result = document.getElementById('receipt-result');
        if (!appId || !file) { result.innerHTML = '<span class="error">Выберите заявку и файл</span>'; return; }
        result.innerHTML = '';
        const formData = new FormData();
        formData.append('receipt', file);
        try {
            const res = await fetch(`/api/applications/${appId}/receipt/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                result.innerHTML = `<span class="success">✅ Чек загружен!</span>`;
                fileInput.value = '';
                setTimeout(() => switchTab('my-apps'), 1500);
            } else {
                result.innerHTML = `<span class="error">❌ ${data.error}</span>`;
            }
        } catch (e) { result.innerHTML = '<span class="error">❌ Ошибка сети</span>'; }
    }

    document.addEventListener('DOMContentLoaded', () => { loadSectionStats(); loadApplications(); });
</script>
</body>
</html>
